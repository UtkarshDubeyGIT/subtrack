name: Desktop installer candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run security:deps:js
      - run: npm run build

  installers:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      VITE_AUTH_BROKER_URL: ${{ vars.VITE_AUTH_BROKER_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run release:prepare
      - name: Build installer for platform testing
        working-directory: apps/desktop
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Record checksums
        shell: bash
        run: python scripts/release/checksums.py apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: Subtrack-candidate-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt

# These are unsigned testing artifacts, never public releases.
# Complete docs/releasing.md before distributing to users.
