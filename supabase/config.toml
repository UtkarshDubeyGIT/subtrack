project_id = "subtrack"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.third_party.clerk]
enabled = true
domain = "env(CLERK_FRONTEND_API_DOMAIN)"

[functions.auth-broker]
verify_jwt = false
