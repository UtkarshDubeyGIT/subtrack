[package]
name = "subtrack-desktop"
version = "0.1.0"
description = "Subtrack secure desktop shell"
edition = "2021"

[lib]
name = "subtrack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
